name: fadli_portfolio
description: "Portfolio website Fadli Jaya — Mobile Engineer, dibangun dengan Flutter Web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.5
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/photos/
    - assets/images/portfolio/
    - assets/images/skills/
    - assets/images/favicons.png
